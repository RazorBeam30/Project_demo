<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medmitra – Sign in or create an account</title>
  <meta name="description" content="Medmitra connects doctors, pharmacists, and patients." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f0f4f3;
      color: #333;
      overflow-x: hidden;
    }

    /* ========== Molecular background pattern ========== */
    .bg-pattern {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    /* ========== Main container ========== */
    .page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      display: flex;
      width: 100%;
      max-width: 960px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      overflow: hidden;
      min-height: 540px;
    }

    /* ========== Left panel ========== */
    .left-panel {
      flex: 1;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      background: linear-gradient(135deg, #fafffe 0%, #f5faf9 100%);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 400;
      color: #c0c8c6;
      line-height: 1.1;
    }

    .brand-title span {
      display: block;
      font-weight: 700;
      color: #38b2a0;
      font-size: 2.8rem;
    }

    .brand-desc {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: #999;
      line-height: 1.7;
      max-width: 340px;
    }

    .illustration-wrapper {
      margin-top: 1.5rem;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .illustration-bg {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,178,160,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .illustration-wrapper svg {
      position: relative;
      z-index: 1;
      max-width: 320px;
      height: auto;
    }

    /* ========== Right panel ========== */
    .right-panel {
      flex: 1;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }

    .form-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #999;
      margin-top: 0.5rem;
      margin-bottom: 2rem;
    }

    /* ========== Role selector ========== */
    .role-selector {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      justify-content: center;
    }

    .role-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.2rem;
      border: 2px solid #ddd;
      border-radius: 25px;
      background: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .role-btn:hover {
      border-color: #38b2a0;
      color: #38b2a0;
    }

    .role-btn.active {
      border-color: #38b2a0;
      background: #eef9f7;
      color: #38b2a0;
    }

    .role-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ========== Form inputs ========== */
    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-group label {
      display: none;
    }

    .input-wrap {
      position: relative;
    }

    #auth-area .form-group input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid #ddd;
      padding: 0.75rem 0.25rem;
      font-size: 0.9rem;
      color: #333;
      background: transparent;
      outline: none;
      transition: border-color 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    #auth-area .form-group input.has-toggle {
      padding-right: 2.5rem;
    }

    #auth-area .form-group input::placeholder {
      color: #bbb;
      font-size: 0.85rem;
    }

    #auth-area .form-group input:focus {
      border-bottom-color: #38b2a0;
    }

    #auth-area .form-group input[aria-invalid="true"] {
      border-bottom-color: #e74c3c;
    }

    .form-group .error-text {
      font-size: 0.72rem;
      color: #e74c3c;
      margin-top: 0.3rem;
      display: none;
    }

    .form-group .error-text.visible {
      display: block;
    }

    .input-wrap .pw-toggle {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      padding: 4px;
      transition: color 0.2s;
    }

    .input-wrap .pw-toggle:hover { color: #666; }

    /* ========== Options row ========== */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      margin-top: 0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #999;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #38b2a0;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 0.8rem;
      color: #999;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #38b2a0;
    }

    /* ========== Buttons ========== */
    .btn-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .btn-login {
      flex: 1;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 25px;
      background: #38b2a0;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-login:hover {
      background: #2d9a89;
      box-shadow: 0 4px 15px rgba(56,178,160,0.35);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-signup {
      flex: 1;
      padding: 0.85rem 1.5rem;
      border: 2px solid #38b2a0;
      border-radius: 25px;
      background: transparent;
      color: #38b2a0;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-signup:hover {
      background: #eef9f7;
    }

    /* ========== Contact link ========== */
    .contact-link {
      text-align: center;
    }

    .contact-link a {
      font-size: 0.82rem;
      color: #666;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .contact-link a:hover {
      color: #38b2a0;
    }

    /* ========== Status message ========== */
    .status-msg {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .status-msg.visible { display: flex; }
    .status-msg.success { background: #eef9f7; color: #1a7a6a; border: 1px solid #c2e9e0; }
    .status-msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    /* ========== Bottom green bar ========== */
    .bottom-bar {
      height: 6px;
      background: linear-gradient(90deg, #38b2a0 0%, #4ecdc4 40%, #56d4c8 60%, #38b2a0 100%);
      border-radius: 3px 3px 0 0;
      position: relative;
      z-index: 1;
    }

    /* ========== Sign-up expanded form ========== */
    .signup-form .form-group {
      margin-bottom: 1rem;
    }

    .form-scroll {
      max-height: 340px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .form-scroll::-webkit-scrollbar { width: 4px; }
    .form-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .back-to-login {
      text-align: center;
      margin-top: 0.75rem;
    }

    .back-to-login button {
      font-size: 0.82rem;
      color: #38b2a0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .back-to-login button:hover { color: #2d9a89; }

    /* ========== Modal ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    .modal-panel {
      position: relative;
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      z-index: 1;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 4px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .modal-close:hover { background: #f1f1f1; }

    .modal-head {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .modal-head .modal-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #eef9f7;
      color: #38b2a0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .modal-head h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #333;
    }

    .modal-head p {
      font-size: 0.82rem;
      color: #999;
      margin-top: 0.4rem;
    }

    .modal-form .form-group input {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #333;
      background: #fafafa;
      outline: none;
      transition: border-color 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .modal-form .form-group input.has-toggle {
      padding-right: 2.5rem;
    }

    .modal-form .form-group input::placeholder {
      color: #bbb;
      font-size: 0.85rem;
    }

    .modal-form .form-group input:focus {
      border-color: #38b2a0;
      background: #fff;
    }

    .modal-form .form-group input[aria-invalid="true"] {
      border-color: #e74c3c;
    }

    .modal-btn-primary {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: #38b2a0;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      font-family: inherit;
      transition: background 0.2s;
    }

    .modal-btn-primary:hover { background: #2d9a89; }
    .modal-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .modal-btn-secondary {
      width: 100%;
      padding: 0.65rem;
      border: none;
      background: none;
      color: #999;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      font-family: inherit;
    }

    .modal-btn-secondary:hover { color: #666; }

    .otp-boxes {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .otp-boxes input {
      width: 44px;
      height: 52px;
      border: 1.5px solid #ddd !important;
      border-radius: 10px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      padding: 0;
    }

    .otp-boxes input:focus {
      border-color: #38b2a0 !important;
      background: #fff;
    }

    .otp-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.8rem;
    }

    .otp-footer button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .otp-footer .change-num { color: #888; }
    .otp-footer .change-num:hover { color: #555; }
    .otp-footer .resend-btn { color: #38b2a0; }
    .otp-footer .resend-btn:disabled { color: #ccc; cursor: not-allowed; }

    /* ========== Animations ========== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: none; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .anim-fade { animation: fadeIn 0.3s ease both; }
    .anim-pop { animation: popIn 0.2s ease both; }
    .spinner { animation: spin 0.7s linear infinite; }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .auth-card {
        flex-direction: column;
        max-width: 440px;
      }

      .left-panel {
        padding: 2rem 1.5rem 1.5rem;
        text-align: center;
      }

      .brand-desc { margin-left: auto; margin-right: auto; }

      .illustration-wrapper svg { max-width: 240px; }

      .right-panel {
        padding: 1.5rem 1.5rem 2rem;
      }

      .brand-title, .brand-title span { font-size: 2rem; }
    }

    @media (max-width: 480px) {
      .left-panel { display: none; }
      .auth-card { border-radius: 0; min-height: 100vh; }
      .page-wrapper { padding: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-fade, .anim-pop, .spinner { animation: none !important; }
      * { transition: none !important; }
    }
  </style>
</head>

  <div class="page-wrapper">
    <div class="auth-card">

      <!-- Left panel: Branding + Illustration -->
      <div class="left-panel">
        <h1 class="brand-title">
          Medmitra
          <span>Healthcare</span>
        </h1>
        <p class="brand-desc">
          Medmitra connects doctors, pharmacists, and patients—verified professionals, clearer prescriptions, and a smoother path from consultation to medicine.
        </p>
        <div class="illustration-wrapper">
          <div class="illustration-bg"></div>
          <!-- Medical team illustration -->
          <svg viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg">
            <!-- Person 1 - Male nurse (left) -->

              <!-- Body -->
              <rect x="15" y="120" width="50" height="80" rx="6" fill="#5ba4cf"/>
              <rect x="15" y="190" width="22" height="90" rx="4" fill="#3b7fb5"/>

            </g>

            <!-- Person 2 - Doctor with glasses -->
            <g transform="translate(150,20)">
              <!-- Legs -->
              <rect x="18" y="210" width="22" height="90" rx="4" fill="#d4c5a0"/>
              <rect x="46" y="210" width="22" height="90" rx="4" fill="#c4b590"/>
              <!-- Body - white coat -->

              <!-- Shirt underneath -->
              <rect x="28" y="130" width="30" height="25" rx="3" fill="#4ecdc4"/>
              <!-- Neck -->
              <rect x="32" y="112" width="20" height="22" rx="4" fill="#f5c6a0"/>
              <!-- Head -->
              <circle cx="42" cy="90" r="30" fill="#f5c6a0"/>

              <path d="M12 82 Q12 52 42 46 Q72 52 72 82 Q72 62 42 58 Q12 62 12 82Z" fill="#c8a055"/>

              <rect x="24" y="82" width="14" height="12" rx="3" fill="none" stroke="#555" stroke-width="1.8"/>
              <rect x="44" y="82" width="14" height="12" rx="3" fill="none" stroke="#555" stroke-width="1.8"/>

              <circle cx="31" cy="88" r="2" fill="#333"/>
              <circle cx="51" cy="88" r="2" fill="#333"/>

              <path d="M35 103 Q42 107 49 103" stroke="#c97" stroke-width="1.5" fill="none"/>

              <rect x="60" y="155" width="25" height="35" rx="3" fill="#b08050"/>

              <line x1="66" y1="166" x2="79" y2="166" stroke="#ddd" stroke-width="1"/>

              <line x1="66" y1="176" x2="75" y2="176" stroke="#ddd" stroke-width="1"/>
            </g>

            <!-- Person 3 - Female doctor (center) -->

<script>
/* ============================================================
   Medmitra – Auth UI (Healthcare-themed redesign)
   ============================================================ */

const DEMO_MODE = true;

/* ---------- Icons ---------- */
const ICON = {
  eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>',
  check: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  shield: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
  lock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  msg: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  arrowLeft: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>',
};

/* ---------- Config ---------- */
const ROLES = {
  doctor:     { label: 'Doctor',     hint: 'Consult & prescribe' },
  pharmacist: { label: 'Pharmacist', hint: 'Verify & dispense' },
};

const FIELDS = {
  signin: [
    { id: 'contact',  label: 'Username', placeholder: 'Username', type: 'text', autocomplete: 'username' },
    { id: 'password', label: 'Password', placeholder: 'Password', type: 'password', autocomplete: 'current-password' },
  ],
  signup: {
    doctor: [
      { id: 'fullName',       label: 'Full name', placeholder: 'Full name (e.g. Dr. Ananya Rao)', type: 'text', autocomplete: 'name' },
      { id: 'specialization', label: 'Specialization', placeholder: 'Specialization (e.g. Cardiology)', type: 'text', list: 'specializations' },
      { id: 'org',            label: 'Hospital / Clinic name', placeholder: 'Hospital / Clinic name', type: 'text', autocomplete: 'organization' },
      { id: 'contact',        label: 'Phone number or email', placeholder: 'Phone number or email', type: 'text', autocomplete: 'username' },
      { id: 'license',        label: 'Medical registration / license number', placeholder: 'Medical registration / license number', type: 'text' },
      { id: 'password',       label: 'Password', placeholder: 'Create password (min 8 chars)', type: 'password', autocomplete: 'new-password' },
    ],
    pharmacist: [
      { id: 'fullName', label: 'Full name', placeholder: 'Full name (e.g. Rahul Mehta)', type: 'text', autocomplete: 'name' },
      { id: 'org',      label: 'Pharmacy center / shop name', placeholder: 'Pharmacy center / shop name', type: 'text', autocomplete: 'organization' },
      { id: 'contact',  label: 'Phone number or email', placeholder: 'Phone number or email', type: 'text', autocomplete: 'username' },
      { id: 'license',  label: 'Pharmacy license number', placeholder: 'Pharmacy license number', type: 'text' },
      { id: 'password', label: 'Password', placeholder: 'Create password (min 8 chars)', type: 'password', autocomplete: 'new-password' },
    ],
  },
};

/* ---------- Backend stubs ---------- */
function authRequest({ mode, role, values }) {
  return new Promise((resolve) => setTimeout(() => resolve({ ok: true }), 900));
}
function otpRequest(action, payload) {
  return new Promise((resolve) => setTimeout(() => resolve({ ok: true }), 700));
}

/* ---------- State ---------- */
const state = { role: null, mode: 'signin', status: null };

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Role buttons ---------- */
document.getElementById('role-group').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-role]');
  if (!btn) return;
  selectRole(btn.dataset.role);
});

function selectRole(role) {
  if (state.role === role) return;
  state.role = role;
  state.mode = 'signin';
  state.status = null;

  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.role === role);
  });

  renderAuth(true);
}

/* ---------- Auth area ---------- */
function renderAuth(animate = true) {
  const area = document.getElementById('auth-area');
  const subtitle = document.getElementById('form-subtitle');

  if (!state.role) {
    subtitle.textContent = 'Welcome back! Please login to your account.';
    area.innerHTML = `
      <div style="text-align:center;padding:2rem 1rem;color:#bbb;font-size:0.85rem;">
        Select your role above to continue.
      </div>`;
    return;
  }

  const isSignIn = state.mode === 'signin';
  const fields = isSignIn ? FIELDS.signin : FIELDS.signup[state.role];
  const roleLabel = ROLES[state.role].label;

  subtitle.textContent = isSignIn
    ? 'Welcome back! Please login to your account.'
    : `Create your ${roleLabel} account.`;

  const fieldsHTML = fields.map(f => {
    const isPw = f.type === 'password';
    return `
      <div class="form-group">
        <label for="${f.id}">${f.label || f.placeholder}</label>
        <div class="input-wrap">
          <input id="${f.id}" name="${f.id}" type="${isPw ? 'password' : 'text'}"
            placeholder="${esc(f.placeholder)}"
            class="${isPw ? 'has-toggle' : ''}"
            ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''}
            ${f.list ? `list="${f.list}"` : ''}
            aria-describedby="${f.id}-err" aria-invalid="false" />
          ${isPw ? `<button type="button" class="pw-toggle" data-toggle-pw="${f.id}" aria-label="Show password" aria-pressed="false">${ICON.eye}</button>` : ''}
        </div>
        <p id="${f.id}-err" class="error-text" role="alert"></p>
      </div>`;
  }).join('');

  area.innerHTML = `
    <div class="${animate ? 'anim-fade' : ''}">
      ${isSignIn ? `
        <form id="auth-form" novalidate>
          ${fieldsHTML}
          <div class="options-row">
            <label class="remember-me">
              <input type="checkbox" /> Remember me
            </label>
            <button type="button" class="forgot-link" id="forgot-link">Forgot Password</button>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn-login" id="submit-btn">Login</button>
            <button type="button" class="btn-signup" id="goto-signup">Sign up</button>
          </div>
          <div class="contact-link">
            <a href="#">Contact us</a>
          </div>
        </form>
      ` : `
        <form id="auth-form" novalidate class="signup-form">
          <div class="form-scroll">
            ${fieldsHTML}
          </div>
          <div class="btn-row" style="margin-top:1.25rem;">
            <button type="submit" class="btn-login" id="submit-btn">Create Account</button>
          </div>
          <div class="back-to-login">
            <button type="button" id="goto-signin">Already have an account? Sign In</button>
          </div>
        </form>
      `}
    </div>`;
}

/* ---------- Delegated events ---------- */
document.getElementById('auth-area').addEventListener('click', (e) => {
  if (e.target.closest('#goto-signup')) {
    state.mode = 'signup';
    state.status = null;
    renderAuth(true);
    return;
  }
  if (e.target.closest('#goto-signin')) {
    state.mode = 'signin';
    state.status = null;
    renderAuth(true);
    return;
  }
  const pwBtn = e.target.closest('[data-toggle-pw]');
  if (pwBtn) {
    const input = document.getElementById(pwBtn.dataset.togglePw);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    pwBtn.innerHTML = show ? ICON.eyeOff : ICON.eye;
    pwBtn.setAttribute('aria-pressed', String(show));
    pwBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    return;
  }
  if (e.target.closest('#forgot-link')) openModal();
});

document.getElementById('auth-area').addEventListener('input', (e) => {
  if (e.target.matches('input')) clearError(e.target);
});

document.getElementById('auth-area').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const fields = state.mode === 'signin' ? FIELDS.signin : FIELDS.signup[state.role];
  const values = {};
  let firstBad = null;

  fields.forEach((f) => {
    const input = form.elements[f.id];
    values[f.id] = input.value.trim();
    const msg = validate(f, values[f.id], state.mode);
    if (msg) { setError(input, msg); firstBad = firstBad || input; }
  });
  if (firstBad) { firstBad.focus(); return; }

  setLoading(true);
  try {
    const res = await authRequest({ mode: state.mode, role: state.role, values });
    if (!res.ok) throw new Error('Request failed');
    showStatus('success', state.mode === 'signin'
      ? `Signed in as ${ROLES[state.role].label}. Redirecting to your dashboard…`
      : 'Account created! We\'ll verify your license and notify you shortly.');
  } catch (err) {
    showStatus('error', 'Something went wrong. Please try again.');
  }
  setLoading(false);
});

function setLoading(on) {
  const btn = document.getElementById('submit-btn');
  if (!btn) return;
  btn.disabled = on;
  if (on) {
    btn.dataset.origLabel = btn.textContent;
    btn.textContent = 'Please wait…';
  } else {
    btn.textContent = btn.dataset.origLabel || (state.mode === 'signin' ? 'Login' : 'Create Account');
  }
}

function showStatus(type, text) {
  const el = document.getElementById('status-msg');
  el.className = `status-msg visible ${type}`;
  el.innerHTML = `<span>${esc(text)}</span>`;
}

/* ---------- Validation ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const phoneDigits = (s) => s.replace(/[\s\-()]/g, '').replace(/^\+?91/, '');
const isPhone = (s) => /^[6-9]\d{9}$/.test(phoneDigits(s)) || /^\+\d{10,14}$/.test(s.replace(/[\s\-()]/g, ''));

function validate(f, v, mode) {
  const label = f.label || f.placeholder;
  if (!v) return `${label} is required.`;
  if (f.id === 'contact' && !(EMAIL_RE.test(v) || isPhone(v))) return 'Enter a valid email or 10-digit phone number.';
  if (f.id === 'password' && mode === 'signup' && v.length < 8) return 'Password must be at least 8 characters.';
  if (f.id === 'license' && v.length < 4) return 'Enter a valid license number.';
  if (f.id === 'fullName' && v.length < 2) return 'Enter your full name.';
  return '';
}

function setError(input, msg) {
  input.setAttribute('aria-invalid', 'true');
  const p = document.getElementById(input.id + '-err');
  if (p) { p.textContent = msg; p.classList.add('visible'); }
}

function clearError(input) {
  input.setAttribute('aria-invalid', 'false');
  const p = document.getElementById(input.id + '-err');
  if (p) { p.textContent = ''; p.classList.remove('visible'); }
}

/* ============================================================
   Forgot password – phone OTP modal
   ============================================================ */
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');
const otp = { step: 1, phone: '', timer: null, left: 0 };
let lastFocus = null;

function openModal() {
  lastFocus = document.activeElement;
  otp.step = 1; otp.phone = '';
  renderModal();
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  setTimeout(() => modalBody.querySelector('input,button')?.focus(), 30);
}

function closeModal() {
  clearInterval(otp.timer);
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  (document.getElementById('forgot-link') || lastFocus)?.focus();
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Tab') {
    const f = [...document.getElementById('modal-panel').querySelectorAll('button, input, [href]')].filter((el) => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function renderModal() {
  clearInterval(otp.timer);
  const masked = otp.phone ? `+91 ${'•'.repeat(6)}${otp.phone.slice(-4)}` : '';

  if (otp.step === 1) {
    modalBody.innerHTML = `
      <div class="modal-head">
        <div class="modal-icon">${ICON.msg}</div>
        <h2 id="modal-title">Reset your password</h2>
        <p>Enter your registered phone number and we'll text you a 6-digit code.</p>
      </div>
      <form id="otp-form" novalidate class="modal-form">
        <div class="form-group">
          <label for="otp-phone">Phone number</label>
          <input id="otp-phone" type="text" placeholder="98765 43210" autocomplete="tel-national" inputmode="numeric" maxlength="12" />
          <p id="otp-phone-err" class="error-text" role="alert"></p>
        </div>
        <button type="submit" class="modal-btn-primary" id="modal-primary">Send OTP</button>
        <button type="button" class="modal-btn-secondary" data-close>Back to sign in</button>
      </form>`;
  }

  if (otp.step === 2) {
    modalBody.innerHTML = `
      <div class="modal-head">
        <div class="modal-icon">${ICON.shield}</div>
        <h2 id="modal-title">Enter verification code</h2>
        <p>We sent a 6-digit code to <strong>${masked}</strong>.</p>
      </div>
      <form id="otp-form" novalidate class="modal-form">
        <div class="otp-boxes" id="otp-boxes" role="group" aria-label="6-digit code">
          ${[0,1,2,3,4,5].map(i => `<input type="text" inputmode="numeric" maxlength="1" autocomplete="${i===0?'one-time-code':'off'}" aria-label="Digit ${i+1}" data-otp="${i}" />`).join('')}
        </div>
        <p id="otp-err" class="error-text" role="alert" style="text-align:center;"></p>
        ${DEMO_MODE ? '<p style="text-align:center;font-size:0.75rem;color:#bbb;margin-bottom:0.75rem;">Demo mode: any 6-digit code works.</p>' : ''}
        <button type="submit" class="modal-btn-primary" id="modal-primary">Verify code</button>
        <div class="otp-footer">
          <button type="button" class="change-num" data-back>${ICON.arrowLeft} Change number</button>
          <button type="button" class="resend-btn" id="resend" disabled></button>
        </div>
      </form>`;
    startResendTimer(30);
  }

  if (otp.step === 3) {
    modalBody.innerHTML = `
      <div class="modal-head">
        <div class="modal-icon">${ICON.lock}</div>
        <h2 id="modal-title">Create a new password</h2>
        <p>Choose a strong password you haven't used before.</p>
      </div>
      <form id="otp-form" novalidate class="modal-form">
        <div class="form-group">
          <label for="new-pw">New password</label>
          <div class="input-wrap">
            <input id="new-pw" type="password" class="has-toggle" placeholder="At least 8 characters" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-toggle-pw="new-pw" aria-label="Show password">${ICON.eye}</button>
          </div>
          <p id="new-pw-err" class="error-text" role="alert"></p>
        </div>
        <div class="form-group">
          <label for="confirm-pw">Confirm password</label>
          <div class="input-wrap">
            <input id="confirm-pw" type="password" class="has-toggle" placeholder="Re-enter password" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-toggle-pw="confirm-pw" aria-label="Show password">${ICON.eye}</button>
          </div>
          <p id="confirm-pw-err" class="error-text" role="alert"></p>
        </div>
        <button type="submit" class="modal-btn-primary" id="modal-primary">Update password</button>
      </form>`;
  }

  if (otp.step === 4) {
    modalBody.innerHTML = `
      <div class="modal-head">
        <div class="modal-icon anim-pop" style="background:#eef9f7;color:#38b2a0;border-radius:50%;width:64px;height:64px;">
          ${ICON.check}
        </div>
        <h2 id="modal-title">Password updated</h2>
        <p>You can now sign in with your new password.</p>
      </div>
      <button type="button" class="modal-btn-primary" data-close>Back to sign in</button>`;
  }

  setTimeout(() => modalBody.querySelector('input, button[data-close]')?.focus(), 20);
}

function startResendTimer(sec) {
  otp.left = sec;
  const btn = document.getElementById('resend');
  const tick = () => {
    if (!btn || !btn.isConnected) return clearInterval(otp.timer);
    if (otp.left > 0) { btn.disabled = true; btn.textContent = `Resend in ${otp.left}s`; otp.left--; }
    else { btn.disabled = false; btn.textContent = 'Resend code'; clearInterval(otp.timer); }
  };
  tick();
  otp.timer = setInterval(tick, 1000);
}

function modalLoading(on) {
  const b = document.getElementById('modal-primary');
  if (!b) return;
  b.disabled = on;
  b.dataset.label = b.dataset.label || b.textContent;
  b.textContent = on ? 'Please wait…' : b.dataset.label;
}

/* Modal events */
modalBody.addEventListener('click', async (e) => {
  if (e.target.closest('[data-close]')) return closeModal();
  if (e.target.closest('[data-back]')) { otp.step = 1; return renderModal(); }
  if (e.target.closest('#resend')) {
    await otpRequest('send', { phone: otp.phone });
    document.getElementById('otp-boxes').querySelectorAll('input').forEach(i => (i.value = ''));
    document.querySelector('[data-otp="0"]').focus();
    startResendTimer(30);
    return;
  }
  const pw = e.target.closest('[data-toggle-pw]');
  if (pw) {
    const input = document.getElementById(pw.dataset.togglePw);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    pw.innerHTML = show ? ICON.eyeOff : ICON.eye;
    pw.setAttribute('aria-pressed', String(show));
    pw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }
});

modalBody.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-otp]')) {
    t.value = t.value.replace(/\D/g, '').slice(-1);
    const errEl = document.getElementById('otp-err');
    if (errEl) errEl.classList.remove('visible');
    const i = +t.dataset.otp;
    if (t.value && i < 5) document.querySelector(`[data-otp="${i + 1}"]`).focus();
  } else if (t.matches('input')) clearError(t);
});

modalBody.addEventListener('keydown', (e) => {
  if (!e.target.matches('[data-otp]')) return;
  const i = +e.target.dataset.otp;
  if (e.key === 'Backspace' && !e.target.value && i > 0) document.querySelector(`[data-otp="${i - 1}"]`).focus();
  if (e.key === 'ArrowLeft' && i > 0) document.querySelector(`[data-otp="${i - 1}"]`).focus();
  if (e.key === 'ArrowRight' && i < 5) document.querySelector(`[data-otp="${i + 1}"]`).focus();
});

modalBody.addEventListener('paste', (e) => {
  if (!e.target.matches('[data-otp]')) return;
  const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
  if (!digits) return;
  e.preventDefault();
  digits.split('').forEach((d, i) => {
    const el = document.querySelector(`[data-otp="${i}"]`);
    if (el) el.value = d;
  });
  document.querySelector(`[data-otp="${Math.min(digits.length, 5)}"]`).focus();
});

modalBody.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (otp.step === 1) {
    const input = document.getElementById('otp-phone');
    const digits = input.value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
    if (!/^[6-9]\d{9}$/.test(digits)) return setError(input, 'Enter a valid 10-digit mobile number.');
    otp.phone = digits;
    modalLoading(true);
    await otpRequest('send', { phone: digits });
    otp.step = 2; renderModal();
  }

  else if (otp.step === 2) {
    const code = [...modalBody.querySelectorAll('[data-otp]')].map(i => i.value).join('');
    const err = document.getElementById('otp-err');
    if (code.length < 6) {
      if (err) { err.textContent = 'Enter all 6 digits.'; err.classList.add('visible'); }
      return;
    }
    modalLoading(true);
    const res = await otpRequest('verify', { phone: otp.phone, code });
    if (!res.ok && !DEMO_MODE) {
      modalLoading(false);
      if (err) { err.textContent = 'Incorrect code. Try again.'; err.classList.add('visible'); }
      return;
    }
    otp.step = 3; renderModal();
  }

  else if (otp.step === 3) {
    const a = document.getElementById('new-pw');
    const b = document.getElementById('confirm-pw');
    let bad = null;
    if (a.value.length < 8) { setError(a, 'Password must be at least 8 characters.'); bad = bad || a; }
    if (b.value !== a.value || !b.value) { setError(b, 'Passwords do not match.'); bad = bad || b; }
    if (bad) return bad.focus();
    modalLoading(true);
    await otpRequest('reset', { phone: otp.phone, password: a.value });
    otp.step = 4; renderModal();
  }
});

/* ---------- Init ---------- */
renderAuth(false);
</script>
</body>
</html>
