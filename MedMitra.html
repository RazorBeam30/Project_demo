body.big{font-size:20px}
body.hc{--line:var(--ink);--mut:var(--ink)}

header{background:#0F172A;color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:1.3em;margin-right:auto;display:flex;align-items:center;gap:8px}
main{max-width:1120px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.btn{min-height:42px;padding:6px 14px;border-radius:8px;border:2px solid var(--pri);background:var(--card);color:var(--pri);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:all .15s ease}

.btn.p,.btn.on{background:var(--pri);color:var(--onpri)}

label{font-size:.85em;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{background:var(--warn);color:var(--wi);padding:10px 14px;border-radius:8px;margin:8px 0}
.bad{background:var(--bad);color:var(--bi);padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600}
.mut{color:var(--mut)}
.tag{border:2px solid var(--pri);border-radius:99px;padding:2px 10px;font-weight:700;font-size:.85em}

.sheet{background:#fff;color:#0F172A;max-width:760px;margin:0 auto;padding:28px;border-radius:8px}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #94A3B8;padding:6px;text-align:left}

/* Routine Guide Document Styles (Matches the Patient Guide Layout) */
.routine-doc{
  background:#fff;
  color:#0F172A;
  border:1px solid #CBD5E1;
  border-radius:12px;
  padding:24px 28px;
  margin:12px auto;
  box-shadow:0 4px 18px rgba(0,0,0,0.06);
}
.guide-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding-bottom:16px;
  border-bottom:2px solid #E2E8F0;
  flex-wrap:wrap;
}
.brand-title-wrap{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.brand-logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-logo-icon{
  width:44px;
  height:44px;
  border-radius:10px;
  background:linear-gradient(135deg, #0284C7, #0D9488);
  color:#fff;
  display:grid;
  place-items:center;
}
.brand-logo-icon svg{width:26px;height:26px}
.brand-text b{font-size:1.6rem;color:#0F172A;line-height:1.1;display:block}
.brand-text span{font-size:0.75rem;color:#0284C7;font-weight:600;letter-spacing:.3px}
.guide-divider{width:2px;height:42px;background:#CBD5E1}
.guide-main-title h1{margin:0;font-size:1.55rem;color:#0F172A;line-height:1.2}
.guide-main-title p{margin:2px 0 0;font-size:1.05rem;color:#475569;font-weight:600}
.guide-dear-patient{
  max-width:280px;
  font-size:0.8rem;
  line-height:1.35;
  color:#334155;
  background:#F8FAFC;
  border-left:3px solid #0284C7;
  padding:6px 10px;
  border-radius:4px;
}

/* Patient Info Banner */
.patient-info-banner{
  background:#F0F9FF;
  border:1px solid #BAE6FD;
  border-radius:10px;
  padding:12px 18px;
  margin:16px 0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
}
.pib-item{display:flex;align-items:center;gap:10px}
.pib-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  background:#E0F2FE;
  color:#0369A1;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.pib-label{font-size:0.75rem;color:#64748B;font-weight:600;text-transform:uppercase}
.pib-val{font-size:1.05rem;font-weight:700;color:#0F172A}

/* The Main Routine Table */
.table-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.guide-table{
  width:100%;
  border-collapse:collapse;
  font-size:1.1rem;
  margin:10px 0 20px;
  background:#fff;
}
.guide-table th{
  background:#0F3B66;
  color:#fff;
  font-size:0.88rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.3px;
  padding:10px 8px;
  text-align:center;
  border:1px solid #0B2D4F;
  vertical-align:middle;
}
.guide-table td{
  border:1px solid #CBD5E1;
  padding:12px 8px;
  text-align:center;
  vertical-align:middle;
  color:#0F172A;
}
.guide-table tr:nth-child(even) td{background:#F8FAFC}

/* Row elements */
.step-badge{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#16A34A;
  color:#fff;
  font-weight:700;
  font-size:1.05rem;
  display:inline-grid;
  place-items:center;
  box-shadow:0 2px 4px rgba(22,163,74,0.3);
}
.med-cell{
  text-align:left !important;
  display:flex;
  gap:12px;
  align-items:center;
}
.med-mini-img{
  width:72px;
  height:54px;
  border-radius:6px;
  border:1px solid #CBD5E1;
  background:#F1F5F9;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  padding:2px;
}
.med-name-col b{font-size:1.2rem;color:#0F172A;display:block}
.med-name-col span{font-size:0.95rem;color:#475569;font-weight:600}

/* Time Slots (1-0-1-0) Display */
.slot-grid{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  min-width:185px;
}
.slot-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}
.slot-icon{color:#D97706;font-size:0.9rem;display:flex;align-items:center;justify-content:center}
.slot-icon.moon{color:#4338CA}
.slot-lbl{font-size:0.65rem;font-weight:700;color:#64748B}
.slot-val{
  width:34px;
  height:30px;
  border-radius:6px;
  font-weight:800;
  font-size:1.1rem;
  display:grid;
  place-items:center;
}
.slot-val.on{
  background:#DCFCE7;
  color:#15803D;
  border:1.5px solid #86EFAC;
}
.slot-val.off{
  background:#F1F5F9;
  color:#94A3B8;
  border:1.5px solid #E2E8F0;
}

.manual-box-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.manual-check-box{
  width:30px;
  height:30px;
  border:2.5px solid #334155;
  border-radius:6px;
  background:#fff;
  cursor:pointer;
}
.manual-box-lbl{
  font-size:0.68rem;
  color:#64748B;
  font-weight:600;
}

.guide-bottom-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:16px;
  margin-top:20px;
}
.g-card{
  background:#F8FAFC;
  border:1px solid #E2E8F0;
  border-radius:10px;
  padding:14px;

.g-card h3{

  font-size:1.05rem;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0F172A;
}
.timing-list{display:flex;flex-direction:column;gap:6px;font-size:0.95rem}
.timing-row{display:flex;justify-content:space-between;border-bottom:1px dashed #CBD5E1;padding-bottom:3px}
.timing-key{display:flex;align-items:center;gap:6px;font-weight:600}
.timing-val{color:#334155;font-weight:700}
.format-pill{
  margin-top:10px;
  background:#DCFCE7;
  border:1px solid #86EFAC;
  color:#15803D;
  font-weight:700;
  font-size:0.85rem;
  padding:4px 8px;
  border-radius:6px;
  text-align:center;
}
.notes-list{margin:0;padding-left:18px;font-size:0.92rem;color:#334155;line-height:1.45}
.notes-list li{margin-bottom:4px}
.refill-badge{
  font-size:1.25rem;
  font-weight:800;
  color:#0369A1;
  background:#E0F2FE;
  padding:6px 12px;
  border-radius:8px;
  display:inline-block;
  margin:6px 0;
}
.guide-footer-note{
  text-align:center;
  font-size:0.85rem;
  color:#64748B;
  margin-top:24px;
  padding-top:12px;
  border-top:1px solid #E2E8F0;
}

@media print{
  @page{
    size: A4 portrait;
    margin: 6mm 8mm;

    width: 0 !important;
    height: 0 !important;
  }

  .table-responsive{overflow:visible !important}

    border:none !important;
    box-shadow:none !important;
    padding:0 !important;
    margin:0 !important;
  }
  .guide-table{
    width:100% !important;
    font-size:12pt !important;
    page-break-inside:auto;
  }
  .guide-table th{
    background:#0F3B66 !important;
    color:#fff !important;
    padding:8px 4px !important;
    font-size:10pt !important;
    font-weight:900 !important;
  }
  .guide-table td{
    padding:8px 4px !important;
    font-size:11.5pt !important;
    border:1.5px solid #64748B !important;
  }
  .med-name-col b{
    font-size:14pt !important;
    font-weight:900 !important;

  .med-name-col span{
    font-size:10.5pt !important;
    font-weight:700 !important;

  .step-badge{
    background:#16A34A !important;
    color:#fff !important;
    width:28px !important;
    height:28px !important;
    font-size:11pt !important;
  }

    background:#DCFCE7 !important;
    color:#15803D !important;
    border:2px solid #16A34A !important;
    font-size:13pt !important;
    font-weight:900 !important;
    width:28px !important;
    height:28px !important;
  }
  .slot-val.off{
    background:#F1F5F9 !important;
    color:#94A3B8 !important;
    border:1px solid #CBD5E1 !important;

  .manual-check-box{

    background:#fff !important;
    width:28px !important;

  }
  .guide-bottom-grid{
    gap:10px !important;
    margin-top:12px !important;
  }
  .g-card{
    padding:8px !important;
    font-size:9pt !important;
  }
}

const go=(v,id)=>{S.view=v;S.gid=id??S.gid;S.modal=null;S.drawer=0;render();scrollTo(0,0)};

const calcAge=dob=>{
  if(!dob)return '68 years';
  const diff=Date.now()-new Date(dob).getTime();
  const a=Math.abs(new Date(diff).getUTCFullYear()-1970);
  return `${a} years`;
};

const durText=(m,r,L)=>{
  if(m.dtype=='FIXED_DAYS')return `${m.days} ${L.days}<br><span style="font-size:0.85em;color:#64748B">(${fd(r.issued)} – ${fd(addD(r.issued,m.days))})</span>`;
  if(m.dtype=='LONG_TERM')return `${L.lt}<br><span style="font-size:0.85em;color:#64748B">(${r.review? 'Review: '+fd(r.review) : 'Regular checkup'})</span>`;
  if(m.dtype=='UNTIL_REVIEW')return `${L.rev}<br><span style="font-size:0.85em;color:#64748B">${r.review?fd(r.review):'–'}</span>`;
  return L.nd;
};

function dups(){
  const n={};let out=[];
  const add=g=>{g=g.trim().toLowerCase();if(!g)return;if(n[g])out.push(g);n[g]=1};
  S.items.forEach(m=>add(m.gen));
  S.rx.filter(r=>r.pid==S.pid&&r.status=='ACTIVE').forEach(r=>r.items.forEach(m=>{
    const g=m.gen.toLowerCase();if(S.items.some(x=>x.gen.trim().toLowerCase()==g))out.push(g);
  }));
  return[...new Set(out)];
}

function tg(i,s){
  const m=S.items[i],k=m.slots.indexOf(s);
  k<0?m.slots.push(s):m.slots.splice(k,1);
  render();
}

function chip(n,s){
  S.items.push(mk(n,s,'',[],'NOT_SPECIFIED','',''));
  render();
}

function find(q){
  q=q.toLowerCase();
  $('#res').innerHTML=q?S.patients.filter(p=>(p.name+p.phone).toLowerCase().includes(q)).map(p=>`<button class="btn" onclick="S.pid=${p.id};render()">${esc(p.name)} · ${esc(p.phone)}</button>`).join(' ')||'<span class="mut">No match found. Use “Add new patient”.</span>':''
}

function addP(){
  const f=id=>$('#'+id).value.trim();
  if(!f('pn')||!/^\+?[\d\s]{10,14}$/.test(f('pp'))||!$('#pc').checked){
    S.err=['Enter name, a valid phone number and tick the consent box.'];return render();
  }
  const p={id:Date.now(),name:f('pn'),phone:f('pp'),dob:f('pd'),lang:f('pl'),cg:f('pcn'),cgp:f('pcp'),allergy:f('pa')};
  S.patients.push(p);S.pid=p.id;S.add=0;S.err=[];save();render();
}

function submit(){
  const e=[],p=P(S.pid);
  if(!p)e.push('Select or register a patient.');
  if(!S.items.length)e.push('Add at least one medicine.');
  S.items.forEach((m,i)=>{
    const n='Medicine '+(i+1)+': ';
    if(!m.gen.trim())e.push(n+'name is required.');
    if(!(+m.dose>0))e.push(n+'dose must be a number above 0.');
    if(!m.freq)e.push(n+'choose a frequency.');
    else if(m.slots.length!=FQ[m.freq])e.push(n+'select exactly '+FQ[m.freq]+' time slot(s).');
    if(!m.dtype)e.push(n+'choose a duration type.');
    if(m.dtype=='FIXED_DAYS'&&!(+m.days>0))e.push(n+'enter the number of days.');
    if(m.dtype=='UNTIL_REVIEW'&&!S.review)e.push(n+'set a review date.');
    if(m.dtype=='NOT_SPECIFIED'&&!m.ok)e.push(n+'tick “I confirm no duration”.');
  });
  S.err=e;
  if(e.length)return render();

  const r={
    id:Date.now(),pid:p.id,doc:{...S.doc},diag:S.diag,
    issued:iso(new Date()),refill:S.refill,review:S.review,status:'ACTIVE',verified:false,
    items:JSON.parse(JSON.stringify(S.items))
  };
  S.rx.unshift(r);S.items=[];S.diag='';S.review='';S.pid=null;S.gid=r.id;S.modal=r.id;save();render();
}

function disp(id){
  const r=R(id);
  if(!$('#vf')||!$('#vf').checked||r.items.some(m=>!m.pc)){
    S.err=['Choose the dispensed product for every medicine and tick the verification box.'];
    return render();
  }
  r.verified=true;r.status='DISPENSED';S.err=[];save();
  go('guide',id);
}

                  <div class="slot-col">
                    <span class="slot-icon moon" title="Night">${ic('moon')}</span>
                    <span class="slot-val ${vals[3]?'on':'off'}">${vals[3]}</span>
                  </div>
                </div>
              </td>

              <td>
                <div style="display:flex;align-items:center;justify-content:center;gap:6px">
                  <span style="color:#0284C7">${ic('utensils')}</span>
                  <b>${m.food=='NOT_SPECIFIED'?'–':(L[m.food]||m.food)}</b>
                </div>
              </td>
              <td>
                <div style="display:flex;align-items:center;justify-content:center;gap:6px">
                  <span style="color:#0284C7">${ic('calendar')}</span>
                  <div>${durText(m,r,L)}</div>
                </div>
              </td>
              <td>
                <div style="font-size:0.92rem;line-height:1.3;text-align:left;padding:0 4px">
                  ${m.info?`<div style="display:flex;gap:4px;align-items:flex-start"><span style="color:#0284C7;flex-shrink:0">${ic('info')}</span><span>${esc(m.info)}</span></div>`:''}
                  ${m.miss?`<div style="font-size:0.85em;color:#64748B;margin-top:2px">Missed: ${esc(m.miss)}</div>`:''}
                  ${!m.info&&!m.miss?'<span style="color:#94A3B8">–</span>':''}
                </div>
              </td>
              <!-- Manual checklist empty space for humans to write and check with pen -->
              <td>
                <div class="manual-box-wrap">
                  <div class="manual-check-box" title="Empty space for manual verification with pen"></div>
                  <span class="manual-box-lbl">Tick / Date</span>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <!-- Supportive Info Cards matching bottom of design -->
    <div class="guide-bottom-grid">
      <!-- Medicine Timing Guide -->
      <div class="g-card">
        <h3><span style="color:#0284C7">${ic('clock')}</span> Medicine Timing Guide</h3>
        <div class="timing-list">
          <div class="timing-row">
            <span class="timing-key" style="color:#D97706">${ic('sunrise')} Morning</span>
            <span class="timing-val">6:00 AM – 10:00 AM</span>
          </div>
          <div class="timing-row">
            <span class="timing-key" style="color:#D97706">${ic('sun')} Afternoon</span>
            <span class="timing-val">11:00 AM – 3:00 PM</span>
          </div>
          <div class="timing-row">
            <span class="timing-key" style="color:#D97706">${ic('sunset')} Evening</span>
            <span class="timing-val">4:00 PM – 9:00 PM</span>
          </div>
          <div class="timing-row">
            <span class="timing-key" style="color:#4338CA">${ic('moon')} Night</span>
            <span class="timing-val">9:00 PM – 12:00 AM</span>
          </div>
        </div>
        <div class="format-pill">
          1 - 0 - 1 - 0 &nbsp;=&nbsp; Morning - Afternoon - Evening - Night
        </div>
      </div>

      <!-- Refill Reminder -->
      <div class="g-card">
        <h3><span style="color:#16A34A">${ic('calendar-check')}</span> Refill Reminder</h3>
        <p style="margin:4px 0">Your next refill is due around:</p>
        <div class="refill-badge">${fd(r.refill)}</div>
        <p style="margin:4px 0;font-size:0.85rem;color:#475569">
          Please contact the pharmacy 3 days before this date to avoid running out of essential medicine.
        </p>
      </div>

      <!-- Important Notes -->
      <div class="g-card">
        <h3><span style="color:#DC2626">${ic('alert-circle')}</span> Important Notes</h3>
        <ul class="notes-list">
          <li>Do not stop any medicine without consulting your doctor.</li>
          <li>If you miss a dose, take it as soon as you remember unless close to next dose.</li>
          <li>Do not double the dose to make up for a missed one.</li>
          <li>Keep this guide safe and refer to it daily.</li>
        </ul>
      </div>

      <!-- Need Help -->
      <div class="g-card">
        <h3><span style="color:#0284C7">${ic('phone-call')}</span> Need Help?</h3>
        <div style="font-size:0.92rem;line-height:1.45;color:#334155">
          <div><b>Pharmacy Helpline:</b></div>
          <div style="font-size:1.15rem;font-weight:700;color:#0284C7;margin:2px 0 6px">1800 123 4567</div>
          <div><b>Consultant Doctor:</b></div>
          <div style="font-weight:600">${esc(r.doc.name)}</div>
          <div class="mut" style="font-size:0.85rem">${esc(r.doc.phone)}</div>
          <div style="margin-top:8px;font-style:italic;color:#0D9488;font-weight:600">Take care! ♡</div>
        </div>
      </div>
    </div>

    <div class="guide-footer-note">
      <b>MedMitra</b> — Your Health, Our Priority
    </div>
  </div>`;
}

function render(){
  document.body.classList.toggle('big',!!S.big);
  document.body.classList.toggle('hc',!!S.hc);
  document.body.classList.toggle('mo',!!S.modal);

  const r=R(S.gid);
  $('#app').innerHTML=`
    <header>
      <b>${ic('heart-pulse')} MedMitra</b>
      <button class="btn" onclick="go('doctor')">${ic('file-plus')} Doctor Portal</button>
      <button class="btn" onclick="S.drawer=1;render()">${ic('history')} Prescriptions (${S.rx.length})</button>
    </header>
    <main>
      ${S.view=='guide'&&r?guideTable(r):S.view=='pharm'&&r?pharm(r):doctor()}
    </main>
    ${S.drawer?`
      <aside class="drawer">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h2 style="margin:0">Recent Prescriptions</h2>
          <button class="btn" onclick="S.drawer=0;render()" aria-label="Close">${ic('x')}</button>
        </div>
        ${S.rx.map(x=>`
          <div class="card" style="margin-bottom:12px">
            <b style="font-size:1.15em">${esc(P(x.pid).name)}</b>
            <div class="mut" style="font-size:0.85em;margin:2px 0">${fd(x.issued)}</div>
            <span class="tag">${x.status=='ACTIVE'?'● ':'✓ '}${x.status}</span>
            <div class="row" style="margin-top:10px">
              <button class="btn" onclick="S.gid=${x.id};S.modal=${x.id};S.drawer=0;render()">Slip</button>
              <button class="btn on" onclick="go('guide',${x.id})">Guide</button>
              <button class="btn" onclick="go('pharm',${x.id})">Verify</button>
            </div>
          </div>
        `).join('')}
      </aside>`:''}
    ${S.modal&&R(S.modal)?slip(R(S.modal)):''}
  `;
  window.lucide&&lucide.createIcons();
  S.err=[];
}

render();
</script></body></html>
