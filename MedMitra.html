${d.length?`<div class="warn">${ic('copy')} Possible duplicate: ${esc(d.join(', '))}. Doctor/pharmacist to review.</div>`:''}

<label style="margin-top:8px">Time slots ${m.freq?`(select ${FQ[m.freq]})`:'(choose frequency first)'}</label><div class="row">${SL.map(s=>`<button class="btn ${m.slots.includes(s)?'on':''}" aria-pressed="${m.slots.includes(s)}" onclick="tg(${i},'${s}')">${ic(ICO[s])} ${T.en[s]}</button>`).join('')}</div>
<div class="g" style="margin-top:8px"><div><label>Additional instructions (shown exactly as written)</label><input value="${esc(m.info)}" oninput="S.items[${i}].info=this.value"></div><div><label>If a dose is missed (optional)</label><input value="${esc(m.miss)}" oninput="S.items[${i}].miss=this.value"></div></div>
${m.dtype=='NOT_SPECIFIED'?`<label class="tk"><input type="checkbox" ${m.ok?'checked':''} onchange="S.items[${i}].ok=this.checked"> I confirm no duration</label>`:''}<button class="btn" style="margin-top:8px" onclick="S.items.splice(${i},1);render()">${ic('trash-2')} Remove</button></div>`).join('')}
<button class="btn p" onclick="submit()">${ic('check')} Save & open prescription slip</button></section>`}
function guide(r){const L=T[S.lang],p=P(r.pid),k=m=>S.taken;return`<div class="row noprint">${['en','hi','kn'].map(l=>`<button class="btn ${S.lang==l?'on':''}" onclick="S.lang='${l}';render()">${{en:'English',hi:'हिन्दी',kn:'ಕನ್ನಡ'}[l]}</button>`).join('')}<button class="btn ${S.big?'on':''}" onclick="S.big^=1;render()">${ic('a-large-small')} Larger text</button><button class="btn ${S.hc?'on':''}" onclick="S.hc^=1;render()">${ic('contrast')} High contrast</button><button class="btn" onclick="print()">${ic('printer')} Print</button><button class="btn" onclick="go('pharm',${r.id})">${ic('pill')} Pharmacy</button></div>
<h1>${L.title}</h1><div class="card"><div class="g"><div><label>${L.patient}</label><b>${esc(p.name)}</b></div><div><label>${L.issued}</label><b>${fd(r.issued)}</b></div><div><label>${L.doctor}</label><b>${esc(r.doc.name)}</b></div><div><label>${L.helpline}</label><b>${esc(r.doc.phone)}</b></div></div>${p.allergy?`<div class="bad">${ic('alert-triangle')} ${L.allergy}: ${esc(p.allergy)}</div>`:''}</div>
${SL.map(s=>{const its=r.items.filter(m=>m.slots.includes(s));return its.length?`<section class="blk" id="b-${s}"><h2>${ic(ICO[s])} ${L[s]} <button class="btn noprint" style="margin-left:auto" onclick="say('b-${s}')">${ic('volume-2')} ${L.listen}</button></h2>${its.map(m=>{const key=`${r.id}|${m.gen}|${s}|${iso(new Date())}`,sp=sup(m);return`<div class="card med"><h3>${esc(m.gen)}${m.brand?` (${esc(m.brand)})`:''}</h3><div class="st">${esc(m.strength)}</div>${r.verified&&m.pc?pack(PC.find(c=>c.id==m.pc).n,PC.find(c=>c.id==m.pc).s):''}<div class="g" style="margin-top:8px"><div><label>${L.dose}</label><b>${m.dose} ${L[m.unit]||m.unit}</b></div><div><label>${L.when}</label><b>${L[s]} · ${L[m.freq]}${m.food!='NOT_SPECIFIED'?' · '+L[m.food]:''}</b></div><div><label>${L.duration}</label><b>${dur(m,r,L)}</b></div></div>${m.info?`<p><label>${L.note}</label>${esc(m.info)}</p>`:''}${m.miss?`<p><label>${L.miss}</label>${esc(m.miss)}</p>`:''}${sp!=null?`<p><label>${L.sup}</label><b>${fd(addD(r.issued,sp-3))}</b></p>`:''}<p class="mut">${r.verified&&m.pc?L.pic:L.nopic}</p><label class="tk noprint"><input type="checkbox" ${S.taken[key]?'checked':''} onchange="tk('${key}',this.checked)"> ${L.taken}</label></div>`}).join('')}</section>`:''}).join('')}`}
function pharm(r){return`${errs()}<h1>Pharmacist verification</h1><p class="mut">${esc(P(r.pid).name)} · <span class="tag">${r.status}</span></p>${r.items.map((m,i)=>`<div class="card"><b style="font-size:1.2em">${esc(m.gen)} ${esc(m.strength)}</b><div class="g"><div><label>Dispensed product (sample cards)</label><select onchange="R(${r.id}).items[${i}].pc=this.value"><option value="">Choose…</option>${PC.map(c=>`<option value="${c.id}" ${m.pc==c.id?'selected':''}>${c.n} ${c.s}</option>`).join('')}</select></div><div><label>Quantity dispensed</label><input type="number" value="${m.qd}" oninput="R(${r.id}).items[${i}].qd=this.value;save()" onchange="render()"></div></div><p>${sup(m)!=null?`Supply lasts about ${sup(m)} days. Contact pharmacy by <b>${fd(addD(r.issued,sup(m)-3))}</b> (3-day reminder lead time).`:'Supply period not established.'}</p></div>`).join('')}<label class="tk"><input type="checkbox" id="vf"> I verified the displayed product matches what is dispensed.</label><p><button class="btn p" onclick="disp(${r.id})">${ic('check-check')} Mark dispensed</button> <button class="btn" onclick="go('guide',${r.id})">Back to guide</button></p>`}
function slip(r){const p=P(r.pid);return`<div class="modal"><div class="sheet"><div style="border-bottom:3px solid #0284C7;padding-bottom:8px"><h2 style="margin:0">${esc(r.doc.hosp)}</h2><div>${esc(r.doc.phone)}</div></div><p><b>Patient:</b> ${esc(p.name)} · ${esc(p.phone)}<br><b>Date:</b> ${fd(r.issued)} · <b>Diagnosis:</b> ${esc(r.diag)||'–'}${p.allergy?`<br><b>Allergy:</b> ${esc(p.allergy)}`:''}</p><table><tr><th>Medicine</th><th>Dose</th><th>When</th><th>Food</th><th>Duration</th></tr>${r.items.map(m=>`<tr><td><b>${esc(m.gen)}</b>${m.brand?` (${esc(m.brand)})`:''} ${esc(m.strength)}${m.info?`<br><i>${esc(m.info)}</i>`:''}</td><td>${m.dose} ${m.unit}</td><td>${m.slots.map(s=>T.en[s]).join(', ')}</td><td>${m.food=='NOT_SPECIFIED'?'–':T.en[m.food]}</td><td>${dur(m,r,T.en)}</td></tr>`).join('')}</table><p>Refill due: ${fd(r.refill)}${r.review?` · Review: ${fd(r.review)}`:''}</p><div style="display:flex;justify-content:space-between;align-items:end;margin-top:30px"><div style="border:2px dashed #64748B;width:90px;height:90px;display:grid;place-items:center;font-size:12px">QR placeholder</div><div style="text-align:center"><div style="border-top:2px solid #0F172A;width:220px;padding-top:4px">${esc(r.doc.name)}<br>${esc(r.doc.nmc)}</div></div></div><div class="row noprint" style="margin-top:20px"><button class="btn p" onclick="print()">${ic('printer')} Print Prescription (PDF)</button><button class="btn" onclick="go('guide',${r.id})">Open patient guide</button><button class="btn" onclick="S.modal=null;render()">Close</button></div></div></div>`}
function render(){document.body.classList.toggle('big',!!S.big);document.body.classList.toggle('hc',!!S.hc);document.body.classList.toggle('mo',!!S.modal);const r=R(S.gid);
$('#app').innerHTML=`<header><b>${ic('heart-pulse')} MedMitra</b><button class="btn" onclick="go('doctor')">${ic('file-plus')} New prescription</button><button class="btn" onclick="S.drawer=1;render()">${ic('history')} Recent (${S.rx.length})</button></header><main>${S.view=='guide'&&r?guide(r):S.view=='pharm'&&r?pharm(r):doctor()}</main>${S.drawer?`<aside class="drawer"><div class="row"><h2 style="margin:0;margin-right:auto">Recent prescriptions</h2><button class="btn" onclick="S.drawer=0;render()" aria-label="Close">${ic('x')}</button></div>${S.rx.map(x=>`<div class="card"><b>${esc(P(x.pid).name)}</b><div class="mut">${fd(x.issued)}</div><span class="tag">${x.status=='ACTIVE'?'● ':'✓ '}${x.status}</span><div class="row" style="margin-top:8px"><button class="btn" onclick="S.gid=${x.id};S.modal=${x.id};S.drawer=0;render()">Slip</button><button class="btn" onclick="go('guide',${x.id})">Guide</button><button class="btn" onclick="go('pharm',${x.id})">Verify</button></div></div>`).join('')}</aside>`:''}${S.modal&&R(S.modal)?slip(R(S.modal)):''}`;
window.lucide&&lucide.createIcons();S.err=S.err}
render();
</script></body></html>
